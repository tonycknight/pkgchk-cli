name: Build & Release

permissions:
  actions: read
  pull-requests: write
  security-events: write
  contents: write
  checks: write

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '**/*.md'
  merge_group:
  workflow_dispatch:  

env:
  package-version-number: 0.0.${{ github.run_number }}
  nuget-package-name: pkgchk-cli.nupkg
  
jobs:
 
  sca:
    name: Check SCA
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Dependency scan
        uses: tonycknight/pkgchk-action@v1
        with: 
          scan-issues: true
          scan-upgrades: true
          config: pkgchk.config.yml
          trace: true         
          
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        
      - name: Tool restore
        run: dotnet tool restore
      
      - name: App restore
        run: dotnet restore

      - name: Run Tests
        run: |
          dotnet test ./tests/pkgchk-cli.tests/pkgchk-cli.tests.fsproj -c Debug -- --coverage --coverage-output-format cobertura --report-trx
      
      - name: Unit test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: unit test results
          path: ${{ github.workspace }}/TestResults/*.trx
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate code coverage
        run: dotnet reportgenerator -reports:./TestResults/*.cobertura.xml -targetdir:./publish/codecoverage -reporttypes:Html  

      - name: Code coverage results
        uses: 5monkeys/cobertura-action@v14
        with:
          path: ${{ github.workspace }}/TestResults/*.cobertura.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_coverage: 1
          fail_below_threshold: true
          show_line: true
          show_branch: true
          show_missing: true
          show_class_names: true
          link_missing_lines: true
          report_name: code coverage results

  integration-tests:
    name: Integration Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]        
    runs-on: ${{ matrix.os }}
    env:
      VSTEST_CONNECTION_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        
      - name: Tool restore
        run: dotnet tool restore
      
      - name: App restore
        run: dotnet restore

      - name: Run Tests
        run: dotnet test ./tests/pkgchk-cli.tests.integration/pkgchk-cli.tests.integration.fsproj -c Debug -- --report-trx

      - name: Integration test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: integration test results - ${{ matrix.os }}
          path: ${{ github.workspace }}/TestResults/*.trx
          reporter: dotnet-trx
          path-replace-backslashes: true
          token: ${{ secrets.GITHUB_TOKEN }}          
  
  package-app:
    name: Test App Packaging
    runs-on: ubuntu-latest
        
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
          
      - name: Tool restore
        run: dotnet tool restore
      
      - name: App restore
        run: dotnet restore
        
      - name: Build package 
        run: |
          dotnet pack -c Release -o ./package/ -p:PackageVersion=${{ env.package-version-number }}-preview -p:Version=${{ env.package-version-number }}-preview /p:ContinuousIntegrationBuild=true

      - name: Archive package
        uses: actions/upload-artifact@v7
        with:
          name: pkgchkcli-package
          path: ./package/*.nupkg

  nuget-release:
    name: Push to Nuget
    runs-on: ubuntu-latest
    needs: [ sca, unit-tests, integration-tests, package-app ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Determine version
        run: echo "package-version-number=$(git describe --tags --dirty)" >> $GITHUB_ENV

      - name: Report version
        run: echo "Building package ${{ env.package-version-number }}" >> $GITHUB_STEP_SUMMARY
                  
      - name: Tool restore
        run: dotnet tool restore
      
      - name: App restore
        run: dotnet restore
        
      - name: Build package 
        run: dotnet pack -c Release -o ./package/ -p:PackageVersion=${{ env.package-version-number }} -p:Version=${{ env.package-version-number }} /p:ContinuousIntegrationBuild=true

      - name: Push nuget package
        run: dotnet nuget push "package/*.nupkg"  --api-key ${{ secrets.NUGET_PAT }} --source "nuget.org"
